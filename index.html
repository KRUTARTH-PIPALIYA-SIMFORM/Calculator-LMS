<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="author" content="Krutarth Pipaliya" />
        <meta name="description" content="Basic calculator" />

        <title>Calculator</title>

        <link rel="stylesheet" href="styles/index.css" />
        <script src="scripts/index.js" defer></script>
    </head>
    <body>
        <div class="main-wrapper">
            <main>
                <header class="main-header">
                    <a
                        href="xz.com"
                        aria-label="hamburger"
                        class="main-header-hamburger"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            x="0px"
                            y="0px"
                            width="2rem"
                            height="2rem"
                            viewBox="0 0 50 50"
                            fill="white"
                        >
                            <path
                                d="M 5 8 A 2.0002 2.0002 0 1 0 5 12 L 45 12 A 2.0002 2.0002 0 1 0 45 8 L 5 8 z M 5 23 A 2.0002 2.0002 0 1 0 5 27 L 45 27 A 2.0002 2.0002 0 1 0 45 23 L 5 23 z M 5 38 A 2.0002 2.0002 0 1 0 5 42 L 45 42 A 2.0002 2.0002 0 1 0 45 38 L 5 38 z"
                            ></path>
                        </svg>
                    </a>
                    <h2>Scientific</h2>
                </header>
                <div class="main-input-display">
                    <input
                        type="text"
                        readonly
                        class="main-input"
                        placeholder="0"
                    />
                </div>
                <div class="buttons-components-wrapper">
                    <div class="functions-container">
                        <div class="function-row">
                            <div class="function-button disabled disabled">
                                DEG
                            </div>
                            <div class="function-button disabled">F-E</div>
                        </div>
                        <div class="function-row">
                            <div class="function-button disabled gray">MC</div>
                            <div class="function-button disabled gray">MR</div>
                            <div class="function-button disabled">M+</div>
                            <div class="function-button disabled">M-</div>
                            <div class="function-button disabled">MS</div>
                        </div>
                    </div>
                    <div class="operations">
                        <div class="function-row">
                            <div class="function-button disabled">
                                Trigonometry
                            </div>
                            <div class="function-button disabled">Function</div>
                        </div>

                        <div class="buttons-grid-wrapper">
                            <button class="operations-button">2nd</button>
                            <button class="operations-button">π</button>
                            <button class="operations-button">e</button>
                            <button class="operations-button">C</button>
                            <button class="operations-button">⌫</button>

                            <button class="operations-button">x²</button>
                            <button class="operations-button">1/x</button>
                            <button class="operations-button">|x|</button>
                            <button class="operations-button">exp</button>
                            <button class="operations-button">mod</button>

                            <button class="operations-button">²√x</button>
                            <button class="operations-button">(</button>
                            <button class="operations-button">)</button>
                            <button class="operations-button">n!</button>
                            <button class="operations-button">÷</button>

                            <button class="operations-button">xʸ</button>
                            <button class="operations-button numbers">7</button>
                            <button class="operations-button numbers">8</button>
                            <button class="operations-button numbers">9</button>
                            <button class="operations-button">×</button>

                            <button class="operations-button">10ˣ</button>
                            <button class="operations-button numbers">4</button>
                            <button class="operations-button numbers">5</button>
                            <button class="operations-button numbers">6</button>
                            <button class="operations-button">−</button>

                            <button class="operations-button">log</button>
                            <button class="operations-button numbers">1</button>
                            <button class="operations-button numbers">2</button>
                            <button class="operations-button numbers">3</button>
                            <button class="operations-button">+</button>

                            <button class="operations-button">ln</button>
                            <button class="operations-button numbers">±</button>
                            <button class="operations-button numbers">0</button>
                            <button class="operations-button numbers">.</button>
                            <button class="operations-button equals">=</button>
                        </div>
                    </div>
                </div>
            </main>
            <aside></aside>
        </div>
    </body>
</html>
