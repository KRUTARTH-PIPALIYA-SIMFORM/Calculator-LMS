<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="author" content="Krutarth Pipaliya" />
        <meta name="description" content="Basic calculator" />

        <title>Calculator</title>

        <link rel="stylesheet" href="styles/index.css" />
        <script src="scripts/index.js" type="module" defer></script>
    </head>
    <body>
        <div class="main-wrapper">
            <main>
                <header class="main-header">
                    <button
                        class="main-header-hamburger"
                        aria-label="toggle-hamburger"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            x="0px"
                            y="0px"
                            width="2rem"
                            height="2rem"
                            viewBox="0 0 50 50"
                            fill="white"
                        >
                            <path
                                d="M 5 8 A 2.0002 2.0002 0 1 0 5 12 L 45 12 A 2.0002 2.0002 0 1 0 45 8 L 5 8 z M 5 23 A 2.0002 2.0002 0 1 0 5 27 L 45 27 A 2.0002 2.0002 0 1 0 45 23 L 5 23 z M 5 38 A 2.0002 2.0002 0 1 0 5 42 L 45 42 A 2.0002 2.0002 0 1 0 45 38 L 5 38 z"
                            ></path>
                        </svg>
                    </button>
                    <h2>Scientific</h2>
                </header>
                <div class="main-input-display">
                    <input
                        type="text"
                        class="main-input"
                        placeholder="0"
                    />
                </div>
                <div class="buttons-components-wrapper">
                    <div class="functions-container">
                        <div class="function-row">
                            <div class="function-button disabled">DEG</div>
                            <div class="function-button disabled">F-E</div>
                        </div>
                        <div class="function-row">
                            <div class="function-button disabled gray">MC</div>
                            <div class="function-button disabled gray">MR</div>
                            <div class="function-button disabled">M+</div>
                            <div class="function-button disabled">M-</div>
                            <div class="function-button disabled">MS</div>
                        </div>
                    </div>
                    <div class="operations">
                        <div class="function-row">
                            <div class="function-button disabled">
                                Trigonometry
                            </div>
                            <div class="function-button disabled">Function</div>
                        </div>

                        <div class="buttons-grid-wrapper">
                            <button
                                class="operations-button disabled"
                                appendable=""
                            >
                                2nd
                            </button>
                            <button class="operations-button" appendable="3.14">
                                π
                            </button>
                            <button
                                class="operations-button"
                                appendable="2.718"
                            >
                                e
                            </button>
                            <button
                                class="operations-button"
                                appendable="CLEAR"
                            >
                                C
                            </button>
                            <button
                                class="operations-button"
                                appendable="DELETE"
                            >
                                ⌫
                            </button>

                            <button class="operations-button" appendable="^2">
                                x²
                            </button>
                            <button class="operations-button" appendable="1/(">
                                1/x
                            </button>
                            <button class="operations-button" appendable="abs(">
                                |x|
                            </button>
                            <button
                                class="operations-button"
                                appendable="2.718^("
                            >
                                exp
                            </button>
                            <button class="operations-button" appendable="%">
                                mod
                            </button>

                            <button
                                class="operations-button"
                                appendable="sqrt("
                            >
                                ²√x
                            </button>
                            <button class="operations-button" appendable="(">
                                (
                            </button>
                            <button class="operations-button" appendable=")">
                                )
                            </button>
                            <button class="operations-button" appendable="!">
                                n!
                            </button>
                            <button class="operations-button" appendable="/">
                                ÷
                            </button>

                            <button class="operations-button" appendable="^">
                                xʸ
                            </button>
                            <button
                                class="operations-button numbers"
                                appendable="7"
                            >
                                7
                            </button>
                            <button
                                class="operations-button numbers"
                                appendable="8"
                            >
                                8
                            </button>
                            <button
                                class="operations-button numbers"
                                appendable="9"
                            >
                                9
                            </button>
                            <button class="operations-button" appendable="*">
                                ×
                            </button>

                            <button class="operations-button" appendable="10^">
                                10ˣ
                            </button>
                            <button
                                class="operations-button numbers"
                                appendable="4"
                            >
                                4
                            </button>
                            <button
                                class="operations-button numbers"
                                appendable="5"
                            >
                                5
                            </button>
                            <button
                                class="operations-button numbers"
                                appendable="6"
                            >
                                6
                            </button>
                            <button class="operations-button" appendable="-">
                                −
                            </button>

                            <button class="operations-button" appendable="log(">
                                log
                            </button>
                            <button
                                class="operations-button numbers"
                                appendable="1"
                            >
                                1
                            </button>
                            <button
                                class="operations-button numbers"
                                appendable="2"
                            >
                                2
                            </button>
                            <button
                                class="operations-button numbers"
                                appendable="3"
                            >
                                3
                            </button>
                            <button class="operations-button" appendable="+">
                                +
                            </button>

                            <button class="operations-button" appendable="ln(">
                                ln
                            </button>
                            <button
                                class="operations-button numbers"
                                appendable="-"
                            >
                                ±
                            </button>
                            <button
                                class="operations-button numbers"
                                appendable="0"
                            >
                                0
                            </button>
                            <button
                                class="operations-button numbers"
                                appendable="."
                            >
                                .
                            </button>
                            <button
                                class="operations-button equals"
                                appendable="CALCULATE"
                            >
                                =
                            </button>
                        </div>
                    </div>
                </div>
            </main>
            <aside>
                <header class="aside-header">
                    <h3>History</h3>
                </header>
                <div class="history-container">
                    <ul class="history-list">
                    </ul>
                </div>
            </aside>
        </div>
    </body>
</html>
